; Periode backtest Fase 5 (spec 17, PC-25). OOS hanya untuk menilai, tidak untuk menyetel.
; Dipakai run-ea-tests.ps1 -Baseline -Period IS|OOS|ALL|REAL dan tools/periods.py.
; Model 1 = OHLC M1, 4 = every tick based on real ticks.
; Keputusan 2026-10-05 (opsi A): IS dan OOS memakai OHLC M1 agar sebanding dan sampel cukup besar, karena real ticks
; server cent hanya ada sejak 2026-01-05 (XAUUSDc sejak 2026-08-14); bar M1 ada sejak 2024-03-26.
; REAL = cek realisme dengan real ticks sebelum aktivasi komponen (spec 22).
; IS efektif: analisis H4 butuh pemanasan, jadi sinyal pertama sebagian besar simbol baru 2024-05-01..05-13
; (BTC dan XAU sejak April karena historinya lebih panjang). Diukur di backtest v1.23, 2026-10-07.
[IS]
FromDate=2024.04.01
ToDate=2026.07.01
Model=1
[OOS]
FromDate=2026.07.01
ToDate=2026.10.01
Model=1
[REAL]
FromDate=2026.01.05
ToDate=2026.10.01
Model=4
[ShortHistory]
; simbol yang real ticks-nya tidak mencakup periode REAL (tester memakai tick buatan sebelum tanggal itu)
Symbols=XAUUSDc
