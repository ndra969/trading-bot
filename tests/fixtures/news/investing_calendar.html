<!--
  Investing.com economic-calendar fixture for InvestingScraper unit tests.

  This mirrors the FILTER-ENDPOINT fragment
  (/economic-calendar/Service/getCalendarFilteredData -> JSON .data), the
  classic long-stable row format the scraper parses. Schema verified live
  2026-06-27 via scripts/fetch_investing_calendar.py. It includes a day
  separator, high/medium/low events, an "All Day" holiday row (no datetime →
  skipped), and a malformed row (no currency → skipped). Refresh with
  `uv run python scripts/fetch_investing_calendar.py --save`.
-->
<table id="economicCalendarData"><tbody>

  <tr id="eventRowId_551001" class="js-event-item" event_attr_id="1982"
      data-event-datetime="2026/06/25 12:30:00">
    <td class="first left time js-time">12:30</td>
    <td class="left flagCur noWrap"><span class="ceFlags United_States"></span>&nbsp;USD</td>
    <td class="left textNum sentiment noWrap" title="High Volatility Expected" data-img_key="bull3">
      <i class="grayFullBullishIcon"></i><i class="grayFullBullishIcon"></i><i class="grayFullBullishIcon"></i>
    </td>
    <td class="left event"><a href="/x">Nonfarm Payrolls</a> (May)</td>
    <td class="bold act blackFont event-551001-actual">200K</td>
    <td class="fore event-551001-forecast">180K</td>
    <td class="prev blackFont event-551001-previous">175K</td>
    <td></td>
  </tr>

  <tr id="eventRowId_551002" class="js-event-item" event_attr_id="1775"

  <tr id="eventRowId_551004" class="js-event-item" event_attr_id="1234"

    <td class="left textNum sentiment noWrap" title="Low Volatility Expected">

    </td>

    <td class="fore event-551004-forecast">&nbsp;</td>

    <td></td>

  <!-- "All Day" / holiday: no data-event-datetime → dropped, not crashed -->
  <tr id="eventRowId_551003" class="js-event-item" event_attr_id="999">
    <td class="first left time js-time">All Day</td>
    <td class="left flagCur noWrap"><span class="ceFlags Japan"></span>&nbsp;JPY</td>
